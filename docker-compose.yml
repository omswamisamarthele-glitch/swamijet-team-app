# SwamiJet on one VPS: PostgreSQL + app/API + Caddy (automatic HTTPS) + nightly backups.
# Setup: cp .env.example .env, edit it, then: docker compose up -d --build   (see docs/DEPLOY.md)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: swamijet
      POSTGRES_USER: swamijet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swamijet -d swamijet"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://swamijet:${POSTGRES_PASSWORD}@db:5432/swamijet
      TRUST_PROXY: "1"
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://swamijet:${POSTGRES_PASSWORD}@db:5432/swamijet
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./server/scripts/backup.sh:/backup.sh:ro
    # one backup at start, then every 24 hours
    entrypoint: ["/bin/sh", "-c", "while true; do sh /backup.sh || echo 'BACKUP FAILED'; sleep 86400; done"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
