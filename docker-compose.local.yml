# Local testing on your own computer: PostgreSQL + SwamiJet at http://localhost:8080
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml exec app node server/scripts/seed-demo.js   (optional demo data)
# Not for the VPS: no HTTPS, fixed local passwords. See docs/LOCAL_TESTING.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swamijet
      POSTGRES_USER: swamijet
      POSTGRES_PASSWORD: local-only-password
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swamijet -d swamijet"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://swamijet:local-only-password@db:5432/swamijet
      BOOTSTRAP_ADMIN_USER: localadmin
      BOOTSTRAP_ADMIN_PASSWORD: "LocalTest#2026"

volumes:
  pgdata_local:
